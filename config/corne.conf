# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment the following line to increase the keyboard's wireless range
# This didn't seem to actually work sadly
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# https://www.reddit.com/r/crkbd/comments/1kvetly/comment/muana4x/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button

# From reddit re: Arch Linux drop outs /discons
# CONFIG_BT_CTLR_PHY_2M=n

# Also recommended:
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y
